aid: 410-labs
name: 410 Labs
description: >-
  410 Labs is a lean product studio based in Baltimore, Maryland, founded in
  2010 by Dave Troy and Matthew Koll with the mission of helping people
  communicate and access information in new and better ways. The company is best
  known for Mailstrom, a web-based inbox management and email cleanup tool that
  groups messages by sender, subject, time, and size so users can act on
  thousands of related emails at once across Gmail, Google Workspace, Outlook,
  Apple, AOL, Exchange, and any IMAP mail service. 410 Labs also built the Chuck
  iPhone app for fast on-the-go email triage, and earlier products Shortmail and
  Replyz. It is a consumer productivity software company that does not currently
  publish a public developer API; this profile captures its public web
  properties for the API Evangelist network. 410 Labs was surfaced as a
  portfolio company of 500 Global.
